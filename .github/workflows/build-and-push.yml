name: Build and Update Deployment

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout javaapp code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Log in to Container Registry (GitHub Packages)
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # 4. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Capture the git commit SHA to use as the unique image tag
      - name: Get Image Tag
        id: image-tag
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      # 5. Clone the deployment repository using your 'DPAT' Personal Access Token
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: 'anirudh110317/Deployment'
          token: ${{ secrets.DPAT }}
          path: Deployment-repo

      # 6. Update the image tag in the Kubernetes deployment YAML and push changes
      - name: Update Kubernetes YAML and Push
        run: |
          cd Deployment-repo/k8s
          
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          NEW_TAG="${{ steps.image-tag.outputs.TAG }}"
          
          # Use sed to replace the existing image tag with the new commit SHA tag
          sed -i "s|image: ${IMAGE_URI}:.*|image: ${IMAGE_URI}:${NEW_TAG}|g" deployment.yaml
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add deployment.yaml
          git commit -m "chore(k8s): update javaapp image tag to ${NEW_TAG}"
          git push