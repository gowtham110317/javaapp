name: Build, Push and Update Deployment

on:
  push:
    tags:
      - 'v*'  # Triggers when you push a tag like v1.0.0

env:
  REGISTRY: ghcr.io 
  IMAGE_NAME: gowtham110317/javaapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: gowtham110317/Deployment
          token: ${{ secrets.D2PAT }}
          ref: main

      - name: Update Image Tag using sed
        run: |
          TAG_NAME=${{ github.ref_name }}
          echo "Updating deployment.yaml with tag: $TAG_NAME"
          sed -i "s|image: ghcr.io/gowtham110317/javaapp:.*|image: ghcr.io/gowtham110317/javaapp:$TAG_NAME|g" k8s/deployment.yaml

      - name: Commit and Push Changes to Deployment Repo
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add k8s/deployment.yaml
          git commit -m "CI: update javaapp image tag to ${{ github.ref_name }}"
          git push